<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Managersim | Sign up</title>

    <link rel="stylesheet" href="./style/assests.css">
    <link rel="stylesheet" href="./style/components/header.css">
    <link rel="stylesheet" href="./style/login.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
<div class="container">
    <form action="email_verification.html" method="post" class="content">
        <p style="color: black">Sign-up</p>
        <input type="text" placeholder="Username" name="username" class="default_input">
        <input style="margin-top: 3px" type="email" name="email" placeholder="Email" class="default_input">
        <input style="margin-top: 3px" type="password" name="password" placeholder="Password" class="default_input">

        <button type="submit" class="colored_button" style="width: 100%; box-sizing: border-box; border-radius: 5px; margin-top: 5px">Submit</button>

        <hr style="margin-top: 35px; color: rgba(206,206,206,0.24); opacity: 0.3">
        <p style="text-align: center; margin-bottom: 10px">Do you already have an account?</p>
        <a href="./login.html"><button type="button" class="colored_button" style="width: 100%; box-sizing: border-box; border-radius: 5px; margin-top: 5px; background-color: #001433">Login</button></a>
    </form>
</div>
</body>
</html>
