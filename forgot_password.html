<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Forgot your password ?</title>

    <link rel="stylesheet" href="./style/assests.css">
    <link rel="stylesheet" href="./style/components/header.css">
    <link rel="stylesheet" href="./style/login.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <form method="post" class="content">
            <p style="color: black">Forgot your password ?</p>
            <input type="text" name="email" placeholder="Email" class="default_input">

            <p>We will send you a verification message to the quoted address.</p>

            <button type="submit" class="colored_button" style="width: 100%; box-sizing: border-box; border-radius: 5px; margin-top: 5px">Submit</button>

            <a href="./login.html"><button type="button" class="colored_button" style="width: 100%; box-sizing: border-box; border-radius: 5px; margin-top: 5px; background-color: #001433">Back to Login</button></a>
        </form>
    </div>
</body>
</html>
